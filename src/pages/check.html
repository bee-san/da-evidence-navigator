<!-- title: Which services have you been in contact with? -->
<!-- nav: check -->
<!-- script: app/page-check.js -->
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <a href="index.html" class="govuk-back-link">Back</a>

    <div id="question">
      <form id="routes-form" novalidate>
        <div class="govuk-form-group" id="routes-group">
          <fieldset class="govuk-fieldset" aria-describedby="routes-hint">
            <legend class="govuk-fieldset__legend govuk-fieldset__legend--l">
              <h1 class="govuk-fieldset__heading">Which of these have you been in contact with about the abuse?</h1>
            </legend>
            <div id="routes-hint" class="govuk-hint">Select all that apply. You do not need to say what happened.</div>
            <p id="routes-error" class="govuk-error-message" hidden><span class="govuk-visually-hidden">Error:</span> Select at least one option, or select "None of these"</p>
            <div class="govuk-checkboxes" id="routes-options"></div>
          </fieldset>
        </div>
        <button type="submit" class="govuk-button" data-module="govuk-button">Continue</button>
      </form>
    </div>

    <div id="results" data-wipe hidden tabindex="-1"></div>
  </div>
</div>
