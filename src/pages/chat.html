<!-- title: Ask the helper -->
<!-- nav: chat -->
<!-- script: app/page-chat.js -->
<div class="govuk-grid-row">
  <div class="govuk-grid-column-two-thirds">
    <h1 class="govuk-heading-l">Ask the helper</h1>
    <p class="govuk-body">The helper answers questions about evidence for legal aid. It runs on your device and does not save anything. It cannot give legal advice.</p>

    <div class="app-chat__log" id="log" data-wipe role="log" aria-live="polite" aria-label="Conversation"></div>
    <div class="app-chat__quick" id="quick"></div>

    <form id="chat-form" novalidate>
      <div class="govuk-form-group">
        <label class="govuk-label govuk-label--s" for="msg">Your question</label>
        <div id="msg-hint" class="govuk-hint">You can also paste the text of a letter to check it.</div>
        <textarea class="govuk-textarea" id="msg" rows="3" aria-describedby="msg-hint" autocomplete="off"></textarea>
      </div>
      <div class="govuk-button-group">
        <button type="submit" class="govuk-button" data-module="govuk-button">Send</button>
        <button type="button" class="govuk-button govuk-button--secondary" id="clear" data-module="govuk-button">Clear conversation</button>
      </div>
    </form>
  </div>
</div>
